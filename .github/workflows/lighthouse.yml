name: Lighthouse

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install chromium
        shell: bash
      - name: Set CHROME_PATH
        run: |
          chrome_path=$(find ~/.cache/ms-playwright -name chrome -type f | head -n 1)
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run lighthouse:mobile
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
      - run: npm run lighthouse:desktop
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
      - name: List Lighthouse output
        if: always()
        run: ls -la .lighthouseci || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
