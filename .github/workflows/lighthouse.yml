name: Lighthouse

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install chromium
        shell: bash
      - name: Set CHROME_PATH
        run: |
          chrome_path=$(node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath());" 2>/dev/null)
          if [ -z "$chrome_path" ]; then
            echo "Could not resolve Playwright Chromium executable path"
            exit 1
          fi
          if [ ! -x "$chrome_path" ]; then
            echo "Chromium binary not executable: $chrome_path"
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Lighthouse mobile audit
        run: npm run lighthouse:mobile
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
      - name: Lighthouse desktop audit
        run: npm run lighthouse:desktop
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
      - name: List Lighthouse output
        if: always()
        run: ls -la .lighthouseci || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: warn
